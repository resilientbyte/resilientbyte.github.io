<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="t d">
<title id="t">My knowledge map</title>
<desc id="d">A hand-drawn map with four zones of knowledge: Home Town (mastery) at the centre, surrounded by Nearby Villages (fluency), scattered Outposts (fragments) and the foggy Borderlands (awareness) at the edge. Dots are pieces of knowledge, lines are the connections between them.</desc>
